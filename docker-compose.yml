services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fundilink
      POSTGRES_PASSWORD: fundilink
      POSTGRES_DB: fundilink
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
